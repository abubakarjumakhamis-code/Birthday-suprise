<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      background:linear-gradient(135deg,#ff0080,#7928ca,#2afadf);
      background-size:400% 400%;
      animation:bgMove 10s infinite alternate;
      color:white;
      text-align:center;
    }

    @keyframes bgMove{
      0%{background-position:left;}
      100%{background-position:right;}
    }

    .container{
      padding:30px;
      border-radius:20px;
      backdrop-filter:blur(10px);
      background:rgba(255,255,255,0.1);
      box-shadow:0 0 20px rgba(0,0,0,0.3);
      width:90%;
      max-width:500px;
      animation:fadeIn 2s ease;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:scale(0.8);
      }
      to{
        opacity:1;
        transform:scale(1);
      }
    }

    h1{
      font-size:3rem;
      margin-bottom:20px;
      animation:bounce 1.5s infinite;
    }

    @keyframes bounce{
      0%,100%{
        transform:translateY(0);
      }
      50%{
        transform:translateY(-10px);
      }
    }

    p{
      font-size:1.2rem;
      margin-bottom:20px;
      line-height:1.6;
    }

    button{
      padding:15px 30px;
      border:none;
      border-radius:50px;
      font-size:18px;
      cursor:pointer;
      background:white;
      color:#ff0080;
      font-weight:bold;
      transition:0.3s;
    }

    button:hover{
      transform:scale(1.1);
      background:#ffe6f2;
    }

    .surprise{
      display:none;
      margin-top:20px;
      animation:fadeIn 1s ease;
    }

    .cake{
      font-size:80px;
      margin-top:20px;
      animation:rotateCake 3s infinite linear;
    }

    @keyframes rotateCake{
      from{
        transform:rotate(0deg);
      }
      to{
        transform:rotate(360deg);
      }
    }

    .balloon{
      position:absolute;
      bottom:-150px;
      font-size:40px;
      animation:float 10s infinite;
    }

    @keyframes float{
      0%{
        transform:translateY(0);
        opacity:1;
      }
      100%{
        transform:translateY(-120vh);
        opacity:0;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎉 Happy birthday🎂</h1>
    <h2>ASMAA</h2>

    <p>S
      Wishing you happiness, success, love and long life.
      May all your dreams come true ❤️
    </p>

    <button id="btn">
      Open Surprise 🎁
    </button>

    <div class="surprise" id="surprise">
      <h2>🎊 You Are Special 🎊</h2>

      <p>
        Enjoy your beautiful day and keep smiling always 😊
      </p>

      <div class="cake">🎂</div>
    </div>
  </div>

  <audio autoplay loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
  </audio>

  <script>

  const btn = document.getElementById("btn");
  const surprise = document.getElementById("surprise");

  btn.addEventListener("click", () => {
    surprise.style.display = "block";

    btn.innerHTML = "Opened 🎉";
    btn.style.background = "yellow";
  });

  function createBalloon(){

    const balloon = document.createElement("div");

    balloon.classList.add("balloon");

    const emojis = ["🎈","🎉","✨","🎊"];

    balloon.innerHTML =
      emojis[Math.floor(Math.random()*emojis.length)];

    balloon.style.left = Math.random()*100 + "vw";

    balloon.style.animationDuration =
      (5 + Math.random()*5) + "s";

    document.body.appendChild(balloon);

    setTimeout(()=>{
      balloon.remove();
    },10000);
  }

  setInterval(createBalloon,500);
  </script>

</body>
</html>
